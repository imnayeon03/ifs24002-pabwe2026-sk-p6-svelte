[build]
  command = "bun run build"
  publish = "dist"

# File hasil build Vite sudah ber-hash di nama file, jadi aman di-cache 1 tahun
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
